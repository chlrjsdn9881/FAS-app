<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화재 관리 대시보드 — 공학관 4층</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #dde;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 헤더 ── */
    header {
      background: #12122a;
      border-bottom: 2px solid #8b0000;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; color: #ff4d4d; letter-spacing: 1px; }
    #alarm-badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #1e3a1e;
      color: #4caf50;
      transition: all 0.3s;
    }
    #alarm-badge.active {
      background: #5c0000;
      color: #ff4d4d;
      animation: badge-pulse 1s infinite;
    }
    @keyframes badge-pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    /* ── 메인 레이아웃 ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── 맵 영역 ── */
    .map-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080814;
      position: relative;
      overflow: hidden;
    }
    #map-wrap {
      position: relative;
      display: inline-block;
    }
    #floor-img {
      display: block;
      max-height: calc(100vh - 56px);
      max-width: 100%;
      object-fit: contain;
    }

    /* ── 노드 마커 ── */
    .node {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .node.normal       { background: #27ae60; box-shadow: 0 0 10px #27ae6088; }
    .node.disconnected { background: #444;    box-shadow: none; color: #999; }
    .node.fire         { background: #c0392b; box-shadow: 0 0 14px #e74c3c; animation: node-blink 0.5s infinite; }
    @keyframes node-blink { 0%,100% { opacity:1; box-shadow: 0 0 14px #e74c3c; } 50% { opacity:0.2; box-shadow: none; } }

    /* ── 우측 패널 ── */
    .panel {
      width: 290px;
      background: #12122a;
      border-left: 1px solid #1e1e40;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .panel-section {
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e40;
    }
    .panel-section h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #666;
      margin-bottom: 10px;
    }

    /* 알람 버튼 */
    #btn-alarm {
      width: 100%;
      padding: 14px;
      background: #8b0000;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #btn-alarm:hover:not(:disabled) { background: #c0392b; transform: scale(1.02); }
    #btn-alarm:disabled { background: #333; color: #666; cursor: default; }

    #btn-reset {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }
    #btn-reset:hover { border-color: #666; color: #bbb; }

    /* 범례 */
    .legend-row { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; font-size: 13px; }
    .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

    /* 노드 상태 그리드 */
    .node-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .node-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      transition: background 0.4s;
    }
    .node-cell.normal       { background: #27ae60; }
    .node-cell.disconnected { background: #333; color: #666; }
    .node-cell.fire         { background: #c0392b; animation: node-blink 0.5s infinite; }

    /* 이벤트 로그 */
    .log-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px 16px;
    }
    .log-area h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #666;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    #log-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .log-item {
      padding: 5px 0;
      border-bottom: 1px solid #1a1a30;
      font-size: 12px;
      color: #aab;
      line-height: 1.4;
    }
    .log-item .t { color: #444; margin-right: 6px; font-variant-numeric: tabular-nums; }
    .log-item.fire  { color: #ff6b6b; }
    .log-item.alarm { color: #ff4d4d; font-weight: bold; }
    .log-item.warn  { color: #f39c12; }

    /* 연결 상태 바 */
    .conn-bar {
      padding: 6px 16px;
      border-top: 1px solid #1e1e40;
      font-size: 11px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    #conn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #27ae60;
      flex-shrink: 0;
    }
    #conn-dot.off { background: #c0392b; }
  </style>
</head>
<body>

<header>
  <h1>🔥 공학관 4층 — 화재 관리 대시보드</h1>
  <span id="alarm-badge">● 시스템 정상</span>
</header>

<div class="main">

  <!-- 평면도 -->
  <div class="map-area">
    <div id="map-wrap">
      <img id="floor-img" src="floor_map_clean.png" alt="4층 평면도"
           onload="initNodes()" />
      <!-- 노드 마커는 JS가 동적으로 삽입 -->
    </div>
  </div>

  <!-- 우측 패널 -->
  <div class="panel">

    <div class="panel-section">
      <h3>긴급 제어</h3>
      <button id="btn-alarm" onclick="triggerAlarm()">🚨 긴급 대피 알람 발동</button>
      <button id="btn-reset" onclick="resetAlarm()">알람 해제</button>
    </div>

    <div class="panel-section">
      <h3>범례</h3>
      <div class="legend-row"><div class="legend-dot" style="background:#27ae60"></div>정상 (연결됨)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#444"></div>통신 끊김</div>
      <div class="legend-row"><div class="legend-dot" style="background:#c0392b"></div>화재 감지 (점멸)</div>
    </div>

    <div class="panel-section">
      <h3>노드 상태</h3>
      <div class="node-grid" id="node-grid"></div>
    </div>

    <div class="log-area">
      <h3>실시간 이벤트 로그</h3>
      <div id="log-list"></div>
    </div>

    <div class="conn-bar">
      <span id="conn-dot" class="off"></span>
      <span id="conn-text">서버 연결 중...</span>
    </div>

  </div>
</div>

<script>
// ── 노드 좌표 (floorData.js와 동일한 % 기준) ──────────────────
var NODE_COORDS = {
  '1':  { x: 23, y: 70 },
  '2':  { x: 34, y: 71 },
  '3':  { x: 49, y: 70 },
  '4':  { x: 72, y: 70 },
  '5':  { x: 82, y: 70 },
  '6':  { x: 74, y: 63 },
  '7':  { x: 78, y: 62 },
  '8':  { x: 78, y: 51 },
  '9':  { x: 76, y: 29 },
  '10': { x: 76, y: 20 },
};

var mapWrap = document.getElementById('map-wrap');
var nodeMarkers = {};   // id → DOM element (맵 마커)
var nodeCells   = {};   // id → DOM element (우측 그리드 셀)

// ── 노드 마커 + 그리드 셀 생성 ────────────────────────────────
function initNodes() {
  var grid = document.getElementById('node-grid');

  Object.keys(NODE_COORDS).forEach(function(id) {
    var coord = NODE_COORDS[id];

    // 맵 위 마커
    var el = document.createElement('div');
    el.className = 'node disconnected';
    el.textContent = id;
    el.title = id + '번 노드';
    el.style.left = coord.x + '%';
    el.style.top  = coord.y + '%';
    mapWrap.appendChild(el);
    nodeMarkers[id] = el;

    // 우측 그리드 셀
    var cell = document.createElement('div');
    cell.className = 'node-cell disconnected';
    cell.textContent = id;
    grid.appendChild(cell);
    nodeCells[id] = cell;
  });
}

// ── 노드 상태 업데이트 ────────────────────────────────────────
function setNodeState(id, state) {
  var marker = nodeMarkers[id];
  var cell   = nodeCells[id];
  if (marker) marker.className = 'node ' + state;
  if (cell)   cell.className   = 'node-cell ' + state;
}

// ── 로그 추가 ─────────────────────────────────────────────────
function addLog(entry, level) {
  var list = document.getElementById('log-list');
  var div  = document.createElement('div');
  div.className = 'log-item ' + (level || '');
  div.innerHTML = '<span class="t">' + entry.time + '</span>' + entry.message;
  list.insertBefore(div, list.firstChild);
  if (list.children.length > 60) list.removeChild(list.lastChild);
}

// ── 알람 UI ───────────────────────────────────────────────────
function setAlarmUI(active) {
  var badge = document.getElementById('alarm-badge');
  var btn   = document.getElementById('btn-alarm');

  if (active) {
    badge.textContent = '⚠️ 긴급 대피 알람 활성';
    badge.className = 'active';
    btn.textContent = '🚨 알람 발동 중';
    btn.disabled = true;
  } else {
    badge.textContent = '● 시스템 정상';
    badge.className = '';
    btn.textContent = '🚨 긴급 대피 알람 발동';
    btn.disabled = false;
  }
}

// ── REST 호출 ─────────────────────────────────────────────────
function triggerAlarm() { fetch('/alarm/trigger', { method: 'POST' }); }
function resetAlarm()   { fetch('/alarm/reset',   { method: 'POST' }); }

// ── WebSocket ─────────────────────────────────────────────────
var ws, pingTimer;

function connect() {
  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws/admin');

  ws.onopen = function() {
    document.getElementById('conn-dot').className = '';
    document.getElementById('conn-text').textContent = '서버 연결됨';
    // 30초마다 ping으로 연결 유지
    pingTimer = setInterval(function() {
      if (ws.readyState === WebSocket.OPEN) ws.send('ping');
    }, 25000);
  };

  ws.onmessage = function(evt) {
    var data = JSON.parse(evt.data);

    if (data.type === 'init') {
      Object.keys(data.nodes).forEach(function(id) {
        setNodeState(id, data.nodes[id]);
      });
      (data.logs || []).forEach(function(log) {
        addLog(log, log.level);
      });
      setAlarmUI(data.alarm);
    }

    if (data.type === 'node_update') {
      setNodeState(data.node_id, data.state);
      if (data.log) addLog(data.log, data.state === 'fire' ? 'fire' : data.log.level);
      if (data.trigger_alarm) setAlarmUI(true);
    }

    if (data.type === 'alarm') {
      setAlarmUI(data.active);
      if (data.log) addLog(data.log, data.active ? 'alarm' : 'info');
    }
  };

  ws.onclose = function() {
    clearInterval(pingTimer);
    document.getElementById('conn-dot').className = 'off';
    document.getElementById('conn-text').textContent = '연결 끊김 — 3초 후 재연결...';
    setTimeout(connect, 3000);
  };

  ws.onerror = function() { ws.close(); };
}

connect();
</script>
</body>
</html>
